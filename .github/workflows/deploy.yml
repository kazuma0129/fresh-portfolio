name: Deploy to Cloudflare

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test and build
        run: bun run check

      - name: Check agent discovery on the local Worker
        shell: bash
        run: |
          bunx --no-install wrangler dev --local --port 8787 > "$RUNNER_TEMP/portfolio-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          curl --silent --show-error --fail --retry 20 --retry-delay 1 --retry-connrefused \
            --output /dev/null http://127.0.0.1:8787/
          node scripts/verify-discovery.mjs http://127.0.0.1:8787

      - name: Deploy Worker
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
